<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIニュースまとめ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F6FB; --surface:#FFFFFF; --ink:#1B2440; --sub:#5B6580; --line:#DDE3EF;
  --free:#1F9D63; --free-bg:#E3F5EC;
  --mid:#C98A00; --mid-bg:#FFF3D1;
  --paid:#D93F46; --paid-bg:#FDE6E7;
  --accent:#2F4BFF;
  --shadow:0 1px 2px rgba(27,36,64,.06),0 6px 18px rgba(27,36,64,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121726; --surface:#1B2236; --ink:#EEF1FA; --sub:#A3ADC8; --line:#2C3552;
    --free:#4CD08C; --free-bg:#143527;
    --mid:#F2BC3A; --mid-bg:#3A2F10;
    --paid:#FF7A80; --paid-bg:#3E1A1D;
    --accent:#8EA0FF;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#121726; --surface:#1B2236; --ink:#EEF1FA; --sub:#A3ADC8; --line:#2C3552;
  --free:#4CD08C; --free-bg:#143527;
  --mid:#F2BC3A; --mid-bg:#3A2F10;
  --paid:#FF7A80; --paid-bg:#3E1A1D;
  --accent:#8EA0FF;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  font-size:17px;line-height:1.75;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}

/* ヘッダー */
header{padding:28px 0 8px}
header h1{margin:0;font-size:30px;line-height:1.35;font-weight:900;letter-spacing:.02em}
header p{margin:8px 0 0;color:var(--sub);font-size:15px}

/* 料金ボタン（凡例＋絞り込み） */
.legend{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:18px 0 6px}
.chip{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;
  background:var(--surface);border:2px solid var(--line);text-align:left;min-height:48px;font-weight:700;font-size:15px}
.chip i{width:14px;height:14px;border-radius:50%;flex:none;background:var(--sub)}
.chip small{display:block;font-weight:400;color:var(--sub);font-size:12px;line-height:1.3}
.chip[data-f="free"] i{background:var(--free)}
.chip[data-f="mid"] i{background:var(--mid)}
.chip[data-f="paid"] i{background:var(--paid)}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:var(--shadow)}
.chip[data-f="free"][aria-pressed="true"]{border-color:var(--free);background:var(--free-bg)}
.chip[data-f="mid"][aria-pressed="true"]{border-color:var(--mid);background:var(--mid-bg)}
.chip[data-f="paid"][aria-pressed="true"]{border-color:var(--paid);background:var(--paid-bg)}

/* タブ */
.tabs-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 8px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--line);padding:5px;border-radius:18px}
.tab{border:0;background:transparent;border-radius:14px;padding:10px 2px;font-weight:700;font-size:12px;line-height:1.35;min-height:56px}
.tab span{display:block;font-size:20px;line-height:1.2}
.tab small{display:block;font-size:11px;font-weight:700;color:var(--mid)}
.tab[aria-selected="true"]{background:var(--surface);box-shadow:var(--shadow)}

h2{font-size:21px;margin:26px 0 4px;font-weight:900}
h2.sec{font-size:17px;margin-top:28px}
.h-sub{margin:0 0 12px;color:var(--sub);font-size:14px}

/* サービスカード */
.services{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.services{grid-template-columns:1fr 1fr}}
.svc{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.svc-top{display:flex;align-items:center;gap:12px}
.ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:26px;flex:none;background:var(--bg)}
.svc h3{margin:0;font-size:18px;line-height:1.3}
.svc p{margin:0;font-size:15px;color:var(--sub);line-height:1.6}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;margin-top:2px}
.badge.free{background:var(--free-bg);color:var(--free)}
.badge.mid{background:var(--mid-bg);color:var(--mid)}
.badge.paid{background:var(--paid-bg);color:var(--paid)}
.svc-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:13px;color:var(--sub)}
.count{font-weight:700;color:var(--ink);background:var(--bg);padding:2px 10px;border-radius:99px}

/* 記事カード */
.news{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden;position:relative}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:var(--sub)}
.card[data-price="free"]::before{background:var(--free)}
.card[data-price="mid"]::before{background:var(--mid)}
.card[data-price="paid"]::before{background:var(--paid)}
.card > button{display:block;width:100%;text-align:left;background:none;border:0;padding:14px 16px 8px 26px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--sub);margin-bottom:4px}
.new{background:var(--accent);color:#fff;font-weight:900;font-size:12px;padding:1px 9px;border-radius:99px}
.card h3{margin:0;font-size:17px;line-height:1.5}
.card .one{margin:4px 0 0;font-size:15px;color:var(--sub);line-height:1.6}
.more{margin-top:8px;font-size:13px;font-weight:700;color:var(--accent)}
.actions{padding:0 16px 12px 26px}
.savebtn{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 14px;font-weight:700;font-size:14px;min-height:40px}
.savebtn[aria-pressed="true"]{border-color:var(--mid);background:var(--mid-bg)}
.detail{display:none;padding:0 16px 16px 26px;font-size:15px;line-height:1.8;border-top:1px dashed var(--line)}
.card.open .detail{display:block;padding-top:12px}
.card.open .more{display:none}
.src{display:inline-flex;align-items:center;gap:6px;margin-top:4px;padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:700;text-decoration:none;font-size:15px;min-height:44px}
.notice{margin:0 0 10px;padding:8px 12px;border-radius:12px;background:var(--mid-bg);border:1px dashed var(--mid);font-size:13px;line-height:1.6}

/* 用語 */
.term{background:none;border:0;padding:0;font:inherit;color:inherit;border-bottom:2px dotted var(--accent);cursor:help}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  box-shadow:0 -10px 30px rgba(0,0,0,.18);border-radius:20px 20px 0 0;padding:18px 20px calc(18px + env(safe-area-inset-bottom,0px));
  transform:translateY(105%);transition:transform .25s ease;max-width:760px;margin:0 auto}
.sheet.show{transform:none}
.sheet b{font-size:18px}
.sheet p{margin:6px 0 12px;font-size:16px}
.sheet button{padding:10px 20px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;min-height:44px}
.empty{padding:28px;text-align:center;color:var(--sub);background:var(--surface);border-radius:16px;border:1px dashed var(--line)}
footer{margin-top:36px;font-size:13px;color:var(--sub);line-height:1.7}
.fbtn{padding:10px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;min-height:44px;margin:4px 8px 4px 0}
#msg{margin-top:8px;font-size:14px;color:var(--ink)}
@media(prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AIニュースまとめ</h1>
    <p>いま話題のAIを、やさしく・色つきで。</p>
  </header>

  <div class="legend" role="group" aria-label="料金で絞り込む" id="legend">
    <button class="chip" data-f="all" aria-pressed="true"><i></i><span>ぜんぶ<small>すべて表示</small></span></button>
    <button class="chip" data-f="free" aria-pressed="false"><i></i><span>無料<small>お金がかからない</small></span></button>
    <button class="chip" data-f="mid" aria-pressed="false"><i></i><span>無料プランあり<small>無料でも使える／有料は上位版</small></span></button>
    <button class="chip" data-f="paid" aria-pressed="false"><i></i><span>有料のみ<small>使うにはお金がかかる</small></span></button>
  </div>

  <div class="tabs-bar">
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-c="chat" aria-selected="true"><span>💬</span>チャット・コード</button>
      <button class="tab" role="tab" data-c="image" aria-selected="false"><span>🎨</span>画像づくり</button>
      <button class="tab" role="tab" data-c="video" aria-selected="false"><span>🎬</span>動画づくり</button>
      <button class="tab" role="tab" data-c="uncategorized" aria-selected="false"><span>📂</span>未分類</button>
    </div>
  </div>

  <main id="main"></main>

  <footer>
    記事の著作権は、それぞれのサイトにあります。色のきまりは、あらかじめ決めたサービス一覧にもとづきます。料金は変わることがあるので、使う前に公式サイトで確認してください。<br>
    <span id="built"></span><br>
    <button class="term" id="themeBtn" style="margin-top:8px">画面の明るさを切り替える</button>
    <div style="margin-top:12px">
      <button class="fbtn" id="exportBtn">保存した記事のバックアップを書き出す</button>
      <button class="fbtn" id="importBtn">バックアップを読み込む</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
    <div id="msg" role="status" aria-live="polite"></div>
  </footer>
</div>

<div class="sheet" id="sheet" role="dialog" aria-live="polite">
  <b id="sheetT"></b>
  <p id="sheetD"></p>
  <button id="sheetX">とじる</button>
</div>

<script>
var DATA = /*__DATA__*/null;
if(!DATA){DATA = {articles:[], services:[], builtAt:null};}

var DAY = 86400000;
var KEEP_DAYS = 14;
var MAX_PER_CAT = 8;
var BACKUP_REMIND_DAYS = 7;
var SAVED_KEY = "aimatome.saved.v1";
var BACKUP_KEY = "aimatome.lastBackup.v1";
var CATS = {
  chat:{title:"チャット・コード系",sub:"文章の相談やプログラム作りを手伝ってくれるAI"},
  image:{title:"画像づくり系",sub:"言葉で伝えると、絵や写真風の画像を作ってくれるAI"},
  video:{title:"動画づくり系",sub:"言葉や画像から、短い動画を作ってくれるAI"},
  uncategorized:{title:"未分類",sub:"どの分野か判別できなかったAIの記事です"}
};
var PRICE = {free:"無料",mid:"無料プランあり",paid:"有料のみ"};
var GLOSSARY = {
  "プロンプト":"AIに伝える「お願いの文章」のことです。",
  "生成AI":"文章・画像・動画などを、新しく作り出してくれるAIのことです。",
  "無料枠":"無料のまま使える範囲のことです。使いすぎると有料になるものもあります。"
};

var NOW = Date.now();
var state = {cat:"chat", f:"all"};
var storageOk = true;
var openUrls = {};
var view = {news:[], saved:[]};

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function safeUrl(u){return /^https?:\/\//i.test(String(u||""))?String(u):""}
function termify(text){
  var out = text;
  Object.keys(GLOSSARY).forEach(function(k){
    out = out.split(k).join('<button class="term" data-term="'+k+'">'+k+'</button>');
  });
  return out;
}
/* 公開日（ミリ秒）。未来の日付は「いま」に切り下げる */
function ts(a){
  var t = Date.parse(a.published);
  if(isNaN(t) || t > NOW) return NOW;
  return t;
}
function ago(t){
  var h = Math.floor((NOW - t) / 3600000);
  if(h < 1) return "1時間以内";
  if(h < 24) return h+"時間前";
  return Math.floor(h/24)+"日前";
}
function jpDate(iso){
  var t = Date.parse(iso);
  if(isNaN(t)) return "";
  return new Date(t).toLocaleDateString("ja-JP",{timeZone:"Asia/Tokyo",year:"numeric",month:"long",day:"numeric"});
}

/* ---- 保存（ブラウザの中）---- */
function loadSaved(){
  try{
    var raw = localStorage.getItem(SAVED_KEY);
    if(!raw) return [];
    var list = JSON.parse(raw);
    return Array.isArray(list) ? list : [];
  }catch(e){ storageOk = false; return []; }
}
function writeSaved(list){
  try{ localStorage.setItem(SAVED_KEY, JSON.stringify(list)); return true; }
  catch(e){ storageOk = false; return false; }
}
function lastBackup(){
  try{ var v = localStorage.getItem(BACKUP_KEY); return v ? Date.parse(v) : NaN; }
  catch(e){ return NaN; }
}
function setMsg(text){ document.getElementById("msg").textContent = text; }

/* ---- 画面づくり ---- */
function priceBadge(a){
  return PRICE[a.price] ? '<span class="badge '+esc(a.price)+'" style="margin:0">'+PRICE[a.price]+'</span>' : '';
}
function cardHtml(a, kind, idx){
  var isSaved = kind === "saved";
  var open = openUrls[a.url] ? " open" : "";
  var price = PRICE[a.price] ? a.price : "";
  var when = isSaved ? jpDate(a.published) : ago(ts(a));
  var isNew = !isSaved && (NOW - ts(a)) < DAY;
  var href = safeUrl(a.url);
  var link = href
    ? '<a class="src" href="'+esc(href)+'" target="_blank" rel="noopener noreferrer">元記事を開く（'+esc(a.site)+'）</a>'
    : '<span>この記事のリンクは表示できません。</span>';
  var savedNow = isSaved || view.savedUrls[a.url];
  return '<article class="card'+open+'" data-price="'+price+'">'
    + '<button aria-expanded="'+(open?"true":"false")+'" data-card="'+esc(a.url)+'"><div class="meta">'
    + (isNew?'<span class="new">NEW</span>':'')
    + priceBadge(a)
    + (a.service?'<span>'+esc(a.service)+'</span>':'')
    + '<span>'+esc(a.site)+'</span><span>'+esc(when)+'</span></div>'
    + '<h3>'+esc(a.title)+'</h3>'
    + (a.summary?'<p class="one">'+termify(esc(a.summary))+'</p>':'')
    + '<div class="more">くわしく見る ▼</div></button>'
    + '<div class="actions"><button class="savebtn" data-save="'+kind+':'+idx+'" aria-pressed="'+(savedNow?"true":"false")+'">'
    + (isSaved?'保存を外す':(savedNow?'★ 保存ずみ':'☆ 保存'))+'</button></div>'
    + '<div class="detail">'+link+'</div>'
    + '</article>';
}
function tabLabels(saved){
  document.querySelectorAll(".tab").forEach(function(t){
    var c = t.dataset.c;
    var n = saved.filter(function(a){return a.category===c}).length;
    var small = t.querySelector("small");
    if(small) small.remove();
    if(n>0){ var s = document.createElement("small"); s.textContent = "★"+n; t.appendChild(s); }
  });
}
function render(){
  NOW = Date.now();
  var c = state.cat, f = state.f;
  var savedAll = loadSaved();
  view.savedUrls = {};
  savedAll.forEach(function(a){view.savedUrls[a.url] = true;});
  tabLabels(savedAll);

  var inWindow = DATA.articles.filter(function(a){
    return a.category === c && (NOW - ts(a)) <= KEEP_DAYS*DAY;
  }).sort(function(a,b){return ts(b)-ts(a)});
  var news = inWindow.filter(function(a){return f==="all"||a.price===f}).slice(0, MAX_PER_CAT);
  var saved = savedAll.filter(function(a){return a.category===c && (f==="all"||a.price===f)})
    .sort(function(a,b){return Date.parse(b.savedAt||0)-Date.parse(a.savedAt||0)});
  view.news = news; view.saved = saved;

  var html = '<h2>'+CATS[c].title+'</h2><p class="h-sub">'+CATS[c].sub+'</p>';

  if(c !== "uncategorized"){
    var svcs = DATA.services.filter(function(s){return s.category===c && (f==="all"||s.price===f)});
    html += '<h2 class="sec" style="margin-top:18px">サービスのしょうかい</h2><div class="services">';
    if(!svcs.length) html += '<div class="empty" style="grid-column:1/-1">この色のサービスは、いまありません。</div>';
    svcs.forEach(function(s){
      var cnt = inWindow.filter(function(a){return a.service===s.name}).length;
      html += '<div class="svc"><div class="svc-top"><div class="ico" aria-hidden="true">'+esc(s.icon)+'</div><div><h3>'+esc(s.name)+'</h3><span class="badge '+esc(s.price)+'">'+(PRICE[s.price]||"")+'</span></div></div>'
        + '<p>'+termify(esc(s.desc))+'</p><div class="svc-bottom"><span>新着記事</span><span class="count">'+cnt+'件</span></div></div>';
    });
    html += '</div>';
  }

  var savedCat = savedAll.filter(function(a){return a.category===c});
  if(savedCat.length || !storageOk){
    html += '<h2 class="sec">保存した記事（'+savedCat.length+'件）</h2>';
    if(!storageOk) html += '<p class="notice">この画面では保存できません。</p>';
    var last = lastBackup();
    if(savedAll.length && (isNaN(last) || NOW - last >= BACKUP_REMIND_DAYS*DAY)){
      html += '<p class="notice">💾 保存した記事のバックアップを、しばらく取っていません。ページの下の「バックアップを書き出す」を押してください。</p>';
    }
    html += '<div class="news">';
    saved.forEach(function(a,i){ html += cardHtml(a, "saved", i); });
    html += '</div>';
  }

  html += '<h2 class="sec">新着ニュース</h2><div class="news">';
  if(!news.length) html += '<div class="empty">いまこの分野の記事はありません。</div>';
  news.forEach(function(a,i){ html += cardHtml(a, "news", i); });
  html += '</div>';
  document.getElementById("main").innerHTML = html;
}

/* ---- 操作 ---- */
document.getElementById("tabs").addEventListener("click",function(e){
  var b = e.target.closest(".tab"); if(!b) return;
  state.cat = b.dataset.c;
  document.querySelectorAll(".tab").forEach(function(t){t.setAttribute("aria-selected", t===b)});
  render();
});
document.getElementById("legend").addEventListener("click",function(e){
  var b = e.target.closest(".chip"); if(!b) return;
  state.f = b.dataset.f;
  document.querySelectorAll(".chip").forEach(function(t){t.setAttribute("aria-pressed", t===b)});
  render();
});
document.getElementById("main").addEventListener("click",function(e){
  var t = e.target.closest(".term");
  if(t){ e.stopPropagation(); showTerm(t.dataset.term); return; }
  var s = e.target.closest("button[data-save]");
  if(s){ toggleSave(s.dataset.save); return; }
  var b = e.target.closest("button[data-card]");
  if(b){
    var card = b.parentElement;
    card.classList.toggle("open");
    var isOpen = card.classList.contains("open");
    b.setAttribute("aria-expanded", isOpen);
    if(isOpen) openUrls[b.dataset.card] = true; else delete openUrls[b.dataset.card];
  }
});
function toggleSave(key){
  var parts = key.split(":");
  var a = (parts[0]==="saved" ? view.saved : view.news)[Number(parts[1])];
  if(!a) return;
  var list = loadSaved();
  var exists = list.some(function(x){return x.url===a.url});
  if(exists){
    list = list.filter(function(x){return x.url!==a.url});
  }else{
    list.push({title:a.title,published:a.published,site:a.site,summary:a.summary||"",url:a.url,
      category:a.category,service:a.service||"",price:a.price||"",savedAt:new Date().toISOString()});
  }
  if(!writeSaved(list)) setMsg("この画面では保存できません。");
  render();
}
function showTerm(k){
  document.getElementById("sheetT").textContent = k;
  document.getElementById("sheetD").textContent = GLOSSARY[k];
  document.getElementById("sheet").classList.add("show");
}
document.getElementById("sheetX").addEventListener("click",function(){
  document.getElementById("sheet").classList.remove("show");
});
document.getElementById("themeBtn").addEventListener("click",function(){
  var r = document.documentElement;
  var dark = matchMedia("(prefers-color-scheme: dark)").matches;
  var cur = r.getAttribute("data-theme") || (dark?"dark":"light");
  r.setAttribute("data-theme", cur==="dark"?"light":"dark");
});

/* ---- バックアップ ---- */
document.getElementById("exportBtn").addEventListener("click",function(){
  var list = loadSaved();
  if(!list.length){ setMsg("保存した記事がまだありません。"); return; }
  var d = new Date();
  var ymd = d.getFullYear()+("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2);
  var blob = new Blob([JSON.stringify({version:1,articles:list},null,2)],{type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ai-matome-backup-"+ymd+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)}, 1000);
  try{ localStorage.setItem(BACKUP_KEY, new Date().toISOString()); }catch(e){}
  setMsg("バックアップを書き出しました。ダウンロードしたファイルを、大切な場所に置いてください。");
  render();
});
document.getElementById("importBtn").addEventListener("click",function(){
  document.getElementById("importFile").click();
});
function cleanImported(obj){
  if(!obj || obj.version !== 1 || !Array.isArray(obj.articles)) return null;
  var out = [];
  for(var i=0;i<obj.articles.length;i++){
    var a = obj.articles[i];
    if(!a || typeof a.title!=="string" || !safeUrl(a.url) || !CATS[a.category]) return null;
    out.push({title:a.title,
      published:isNaN(Date.parse(a.published))?new Date().toISOString():String(a.published),
      site:String(a.site||""),summary:String(a.summary||""),url:String(a.url),category:a.category,
      service:String(a.service||""),price:PRICE[a.price]?a.price:"",
      savedAt:isNaN(Date.parse(a.savedAt))?new Date().toISOString():String(a.savedAt)});
  }
  return out;
}
document.getElementById("importFile").addEventListener("change",function(e){
  var file = e.target.files && e.target.files[0];
  e.target.value = "";
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    var items = null;
    try{ items = cleanImported(JSON.parse(reader.result)); }catch(err){ items = null; }
    if(!items){ setMsg("このファイルは読み込めません。"); return; }
    var list = loadSaved();
    var have = {};
    list.forEach(function(x){have[x.url]=true;});
    var added = 0;
    items.forEach(function(x){ if(!have[x.url]){ have[x.url]=true; list.push(x); added++; } });
    if(!writeSaved(list)){ setMsg("この画面では保存できません。"); render(); return; }
    setMsg("バックアップを読み込みました（新しく "+added+" 件を追加）。");
    render();
  };
  reader.onerror = function(){ setMsg("このファイルは読み込めません。"); };
  reader.readAsText(file);
});

/* ---- 更新時刻 ---- */
(function(){
  var t = Date.parse(DATA.builtAt);
  if(isNaN(t)) return;
  var d = new Date(t);
  var date = d.toLocaleDateString("ja-JP",{timeZone:"Asia/Tokyo",year:"numeric",month:"long",day:"numeric"});
  var time = d.toLocaleTimeString("ja-JP",{timeZone:"Asia/Tokyo",hour:"numeric",minute:"2-digit",hour12:false});
  document.getElementById("built").textContent = date+" "+time+" 更新";
})();
render();
</script>
